[project]
name = "thecourseforum"
version = "2.0.0"
requires-python = ">=3.12.16,<3.13"
dependencies = [
    "Django>=5.2.19,<6",
    "backoff>=2.2.1,<3",
    "boto3>=1.44.11,<2",
    "django-cachalot>=2.9.1,<3",
    "django-environ>=0.14.0,<0.15",
    "django-filter>=25.2,<26",
    "django-storages>=1.14.6,<2",
    "djangorestframework>=3.18.3,<3.19",
    "gunicorn>=21.2.0,<23",
    "numpy>=1.26.4,<2",
    "pandas>=2.3.3,<3",
    "psycopg[binary]>=3.3.9",
    "python-jose>=3.4.0,<4",
    "redis>=7.4.1",
    "requests>=2.34.2,<3",
    "tqdm>=4.70.1,<5",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    "coverage[toml]>=7.17.5",
    "django-debug-toolbar>=5.2.0,<7",
    "django-stubs>=5.2.9,<6",
    "djangorestframework-stubs>=3.18.2,<4",
    "prek>=0.5.11",
    "ty>=0.0.110",
    "types-requests>=2.33.0.20261030",
    "types-tqdm>=4.70.0.20261122",
    "websocket-client>=1.9.2,<2",
]
lint = [
    "djlint>=1.54.0,<2",
    "ruff>=0.17.6",
]

[tool.uv]
package = false
# Renovate's lock file maintenance has no cooldown of its own for uv.
exclude-newer = "3 days"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W", "UP", "B", "SIM", "DJ"]
ignore = ["DJ001", "DJ008", "DJ012", "SIM102", "SIM108", "SIM114"]

[tool.ruff.lint.per-file-ignores]
"tcf_core/settings/*.py" = ["F403", "F405"]
"tcf_website/admin.py" = ["F403", "F405"]
"tcf_website/legacy_models.py" = ["F403", "F405"]
"tcf_website/models/__init__.py" = ["F401"]
"tcf_website/models/models.py" = ["F403", "F405"]
"tcf_website/tests/test_utils.py" = ["F403", "F405"]
"tcf_website/views/__init__.py" = ["F401"]

[tool.ty.rules]
# Django/ORM noise until ty + django-stubs catch up; re-enable as tooling improves.
unresolved-attribute = "ignore"
possibly-missing-submodule = "ignore"
no-matching-overload = "ignore"
invalid-argument-type = "ignore"
invalid-method-override = "ignore"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["tcf_core", "tcf_website", "manage.py"]
exclude = ["**/migrations", "tcf_website/legacy_models.py"]

[tool.djlint]
profile = "django"
indent = 4
max_line_length = 120
ignore = "H021"

[tool.django-stubs]
django_settings_module = "tcf_core.settings.dev"

[tool.coverage.run]
source = ["tcf_core", "tcf_website"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
