# Based on https://github.com/actions/starter-workflows/blob/main/ci/django.yml
name: Continuous Integration

on:
  pull_request:
    branches:
      - "*"
  merge_group:
  push:
    branches: [master]
  workflow_call:
    outputs:
      succeeded-queue-run-id:
        description: ID of the merge queue run that already tested this commit; if checks ran here, returns empty
        value: ${{ jobs.changes.outputs.succeeded-queue-run-id }}
    inputs:
      compare-to-last-deploy:
        description: Look for application changes since the last successful deploy instead of since the previous push
        type: boolean
        default: false
      export-image:
        description: Upload the tested production image as the tcf-web-image artifact so the deploy can push it instead of rebuilding
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHON_TARGET: "3.12"
  DJANGO_SETTINGS_MODULE: tcf_core.settings.dev
  TCF_ENV: ci
  SECRET_KEY: ci-secret-key-not-for-production
  # Compose service connection values used by the Django container.
  DB_NAME: tcf_db
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: db
  DB_PORT: 5432
  REDIS_URL: redis://valkey:6379/0
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET: tcf-media
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  STATIC_CUSTOM_DOMAIN: localhost:8081
  TF_IN_AUTOMATION: "true"

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      app: ${{ steps.diff.outputs.app }}
      terraform: ${{ steps.diff.outputs.terraform }}
      workflows: ${{ steps.diff.outputs.workflows }}
      shell: ${{ steps.diff.outputs.shell }}
      succeeded-queue-run-id: ${{ steps.diff.outputs.succeeded-queue-run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for application changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          COMPARE_TO_LAST_DEPLOY: ${{ inputs.compare-to-last-deploy }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$COMPARE_TO_LAST_DEPLOY" == "true" ]]; then
            succeeded_queue_run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --event merge_group --commit "$GITHUB_SHA" \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""' || true)
            if [[ -n "$succeeded_queue_run_id" ]]; then
              echo "Merge queue run ${succeeded_queue_run_id} already tested ${GITHUB_SHA}, skipping checks"
              echo "succeeded-queue-run-id=$succeeded_queue_run_id" >> "$GITHUB_OUTPUT"
              echo "app=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            BASE_SHA=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy.yml --branch "$GITHUB_REF_NAME" \
              --status success --limit 1 --json headSha --jq '.[0].headSha // ""' || true)
            echo "Last successful deploy: ${BASE_SHA:-none}"
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base commit, running all checks"
            {
              echo "app=true"
              echo "terraform=true"
              echo "workflows=true"
              echo "shell=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- . ':!iac' ':!.github'
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- .github/workflows/ci.yml
          )
          if [[ -n "$changed" ]]; then
            echo "Application files changed since ${BASE_SHA}:"
            echo "$changed"
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only iac/ or .github/ changed since ${BASE_SHA}"
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
          check() {
            local name=$1
            shift
            local changed
            changed=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- "$@" .github/workflows/ci.yml)
            if [[ -n "$changed" ]]; then
              echo "${name} files changed since ${BASE_SHA}:"
              echo "$changed"
              echo "${name}=true" >> "$GITHUB_OUTPUT"
            else
              echo "No ${name} files changed since ${BASE_SHA}"
              echo "${name}=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check terraform iac
          check workflows .github
          check shell ':(glob)scripts/**/*.sh'

  lint:
    needs: changes
    if: needs.changes.outputs.succeeded-queue-run-id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ env.PYTHON_TARGET }}
          enable-cache: true
          save-cache: false

      - name: Install lint tools
        run: uv sync --frozen --only-group lint --no-install-project

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: djLint templates
        run: uv run --no-sync djlint tcf_website/templates --check --lint

  ty:
    needs: changes
    if: needs.changes.outputs.succeeded-queue-run-id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ env.PYTHON_TARGET }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev --no-install-project

      - name: Run ty
        run: uv run ty check

  django:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    outputs:
      code-coverage: ${{ steps.coverage.outputs.percentage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Compose environment
        run: |
          cat > .env <<EOF
          SECRET_KEY=${SECRET_KEY}
          DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
          TCF_ENV=${TCF_ENV}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          REDIS_URL=${REDIS_URL}
          MINIO_ENDPOINT=${MINIO_ENDPOINT}
          MINIO_BUCKET=${MINIO_BUCKET}
          MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
          MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
          STATIC_CUSTOM_DOMAIN=${STATIC_CUSTOM_DOMAIN}
          EOF

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start Compose backends
        run: nohup docker compose up -d db valkey minio minio-init > "${RUNNER_TEMP}/compose-up.log" 2>&1 &

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          target: prod
          tags: tcf-web:latest
          outputs: type=docker,dest=${{ runner.temp }}/tcf-web-image.tar
          cache-from: type=gha,scope=prod-image
          cache-to: type=gha,scope=prod-image,mode=max
          provenance: false

      - name: Load production image
        run: docker load -i "${RUNNER_TEMP}/tcf-web-image.tar"

      - name: Wait for Compose backends and buckets
        run: |
          for _ in $(seq 1 90); do
            [[ "$(docker inspect -f '{{.State.Status}}' tcf-minio_init 2>/dev/null)" == "exited" ]] && break
            sleep 2
          done
          cat "${RUNNER_TEMP}/compose-up.log"
          docker compose up -d --wait db valkey minio
          code=$(docker inspect -f '{{.State.ExitCode}}' tcf-minio_init)
          if [[ "$code" != "0" ]]; then
            docker logs tcf-minio_init
            echo "::error::Bucket setup exited with code $code"
            exit 1
          fi

      - name: Check for missing migrations
        run: docker compose --profile full run --rm --no-deps web python manage.py makemigrations --check --dry-run

      - name: Migrations & Tests
        run: |
          set -o pipefail
          docker compose --profile full run --rm --no-deps web sh -c \
            'uv run --no-sync --with coverage==7.13.5 coverage run manage.py test && \
             uv run --no-sync --with coverage==7.13.5 coverage report' | tee coverage.txt

      - name: Get code coverage
        id: coverage
        run: |
          echo "percentage=$(awk '$1 == "TOTAL" {print $NF}' coverage.txt)" >> "$GITHUB_OUTPUT"

      - name: Tear down Compose
        if: always()
        run: docker compose --profile full down -v

      - name: Upload tested image
        if: inputs.export-image || github.event_name == 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tcf-web-image
          path: ${{ runner.temp }}/tcf-web-image.tar
          retention-days: 1
          compression-level: 0
          overwrite: true
          if-no-files-found: error

  eslint:
    needs: changes
    if: needs.changes.outputs.succeeded-queue-run-id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install npm packages
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Run ESLint
        run: npx eslint tcf_website/static/

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir: [iac/app, iac/bootstrap]
    env:
      DIR: ${{ matrix.dir }}
      TFLINT_VERSION: 0.66.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Terraform version
        id: terraform-version
        run: echo "version=$(< iac/app/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        if: matrix.dir == 'iac/app'
        run: terraform fmt -check -recursive -diff iac

      - name: Create provider plugin cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Cache provider plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('iac/app/.terraform.lock.hcl', 'iac/bootstrap/.terraform.lock.hcl') }}

      - name: Initialize Terraform
        run: terraform -chdir="$DIR" init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform
        run: terraform -chdir="$DIR" validate -no-color

      - name: Install TFLint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/tflint" "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/tflint"
          gh release download "v${TFLINT_VERSION}" -R terraform-linters/tflint -p tflint_linux_amd64.zip -p checksums.txt
          sha256sum --ignore-missing -c checksums.txt
          unzip -q tflint_linux_amd64.zip -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install TFLint plugins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init --config="$GITHUB_WORKSPACE/iac/.tflint.hcl"

      - name: Run TFLint
        run: tflint --chdir="$DIR" --config="$GITHUB_WORKSPACE/iac/.tflint.hcl" --format=compact

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint" "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/actionlint"
          gh release download "v${ACTIONLINT_VERSION}" -R rhysd/actionlint \
            -p "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -p "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint -color

  shellcheck:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck
        run: shellcheck --severity=warning scripts/*.sh

  iac-lint:
    needs: [changes, terraform, actionlint, shellcheck]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "A required job finished with result: $result"
                exit 1
                ;;
            esac
          done
