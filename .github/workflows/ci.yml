# Based on https://github.com/actions/starter-workflows/blob/main/ci/django.yml
name: Continuous Integration

on:
  pull_request:
    branches:
      - "*"
  push:
    branches: [dev, master]

env:
  PYTHON_TARGET: "3.12"
  DJANGO_SETTINGS_MODULE: tcf_core.settings.dev
  TCF_ENV: ci
  SECRET_KEY: ci-secret-key-not-for-production
  # Compose service connection values used by the Django container.
  DB_NAME: tcf_db
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: db
  DB_PORT: 5432
  REDIS_URL: redis://valkey:6379/0
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET: tcf-media
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  STATIC_BUCKET: tcf-static
  STATIC_CUSTOM_DOMAIN: localhost:8081

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_TARGET }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev --no-install-project

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  djlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_TARGET }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev --no-install-project

      - name: djLint templates
        run: uv run djlint tcf_website/templates --check --lint

  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_TARGET }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev --no-install-project

      - name: Run ty
        run: uv run ty check

  django:
    runs-on: ubuntu-latest
    outputs:
      code-coverage: ${{ steps.coverage.outputs.percentage }}
    steps:
      - uses: actions/checkout@v4

      - name: Create Compose environment
        run: |
          cat > .env <<EOF
          SECRET_KEY=${SECRET_KEY}
          DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
          TCF_ENV=${TCF_ENV}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          REDIS_URL=${REDIS_URL}
          MINIO_ENDPOINT=${MINIO_ENDPOINT}
          MINIO_BUCKET=${MINIO_BUCKET}
          MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
          MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
          STATIC_BUCKET=${STATIC_BUCKET}
          STATIC_CUSTOM_DOMAIN=${STATIC_CUSTOM_DOMAIN}
          EOF

      - name: Start Compose backends
        run: docker compose up -d --wait db valkey minio

      - name: Initialize MinIO buckets
        run: docker compose run --rm minio-init

      - name: Migrations & Tests
        run: |
          docker compose --profile full run --rm --build web sh -c \
            'uv run --with coverage coverage run manage.py test && \
             uv run --with coverage coverage report' | tee coverage.txt

      - name: Get code coverage
        id: coverage
        run: |
          echo "percentage=$(awk '$1 == "TOTAL" {print $NF}' coverage.txt)" >> "$GITHUB_OUTPUT"

      - name: Tear down Compose
        if: always()
        run: docker compose --profile full down -v

  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install npm packages
        run: npm ci

      - name: Run ESLint
        run: npx eslint -c .config/.eslintrc.yml tcf_website/static/
