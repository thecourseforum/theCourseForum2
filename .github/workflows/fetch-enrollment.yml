name: Fetch Enrollment

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: fetch-enrollment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: tcf-prod-cluster
  ECS_SERVICE: tcf-prod-django-service
  ECS_CONTAINER_NAME: django-app
  ECS_LOG_GROUP: /ecs/tcf-prod-django

jobs:
  fetch-enrollment:
    runs-on: ubuntu-latest
    environment: ecs-tasks
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::099933383052:role/tcf-github-task-runner
          allowed-account-ids: "099933383052"

      - name: Run fetch_enrollment on Fargate
        uses: ./.github/actions/ecs-run-task
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          container: ${{ env.ECS_CONTAINER_NAME }}
          log-group: ${{ env.ECS_LOG_GROUP }}
          log-stream-prefix: django
          command: python manage.py fetch_enrollment
