name: Deploy

on:
  push:
    branches: [master, iac]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-prod-app
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_VAR_domain_name: thecourseforumtest.com
  TF_VAR_ecr_image_tag: ${{ github.sha }}
  TERRAFORM_VERSION: 1.16.3
  PLANNER_ROLE_ARN: arn:aws:iam::099933383052:role/tcf-terraform-planner
  DEPLOYER_ROLE_ARN: arn:aws:iam::099933383052:role/tcf-terraform-deployer
  APP_ACCOUNT_ID: "099933383052"
  PLAN_S3_PREFIX: s3://tcf-terraform-state-099933383052/plans/${{ github.run_id }}
  ECS_SERVICE: tcf-prod-django-service
  ECS_CLUSTER: tcf-prod-cluster
  ECR_REPO: tcf-prod-app
  ECR_CONTAINER_NAME: django-app
  ECS_TASK_FAMILY: tcf-prod-django

jobs:
  ci:
    name: Continuous Integration
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/iac'
    uses: ./.github/workflows/ci.yml

  plan:
    name: Terraform plan
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: terraform-plan
    env:
      TF_VAR_dns_role_arn: arn:aws:iam::011713309463:role/tcf-terraform-dns-readonly
    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Assume Terraform planner role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ env.PLANNER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account and role
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          arn=$(aws sts get-caller-identity --query Arn --output text)
          if [[ "$account" != "${APP_ACCOUNT_ID}" || "$arn" != arn:aws:sts::${APP_ACCOUNT_ID}:assumed-role/tcf-terraform-planner/* ]]; then
            echo "Unexpected AWS identity: $arn"
            exit 1
          fi

      - name: Initialize Terraform
        working-directory: iac/app
        run: terraform init -input=false

      - name: Validate Terraform
        working-directory: iac/app
        run: terraform validate -no-color

      - name: Plan infrastructure changes
        working-directory: iac/app
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: Summarize planned changes
        working-directory: iac/app
        run: |
          {
            echo '## Terraform plan'
            echo
            echo "Image: \`${ECR_REPO}:${GITHUB_SHA}\`"
            echo
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Store saved plan
        working-directory: iac/app
        run: |
          aws s3 cp tfplan "${PLAN_S3_PREFIX}/tfplan"
          aws s3 cp --recursive .terraform/build "${PLAN_S3_PREFIX}/build"

  apply:
    name: Build, apply and deploy
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: terraform-prod
    env:
      TF_VAR_dns_role_arn: arn:aws:iam::011713309463:role/tcf-terraform-dns
    steps:
      - name: Require repository admin
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_TRIGGERING_ACTOR}/permission" --jq .permission)
          if [[ "$permission" != "admin" ]]; then
            echo "Only repository admins may apply infrastructure."
            exit 1
          fi

      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Assume Terraform deployer role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ env.DEPLOYER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Check for existing image
        id: image
        run: |
          if output=$(aws ecr describe-images --repository-name "$ECR_REPO" --image-ids imageTag="$GITHUB_SHA" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q ImageNotFoundException <<< "$output"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$output"
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push Docker image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:buildcache,mode=max
          provenance: false

      - name: Initialize Terraform
        working-directory: iac/app
        run: terraform init -input=false

      - name: Download saved plan
        working-directory: iac/app
        run: |
          aws s3 cp "${PLAN_S3_PREFIX}/tfplan" tfplan
          aws s3 cp --recursive "${PLAN_S3_PREFIX}/build" .terraform/build

      - name: Apply saved plan
        working-directory: iac/app
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan

      - name: Delete saved plan
        run: aws s3 rm --recursive "${PLAN_S3_PREFIX}"

      - name: Find applied task definition
        id: task-def
        run: |
          task_def=$(aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" --query taskDefinition)
          image=$(jq -r --arg name "$ECR_CONTAINER_NAME" '.containerDefinitions[] | select(.name == $name) | .image' <<< "$task_def")
          if [[ "$image" != *":${GITHUB_SHA}" ]]; then
            echo "Latest ${ECS_TASK_FAMILY} revision uses $image, expected tag ${GITHUB_SHA}"
            exit 1
          fi
          echo "arn=$(jq -r .taskDefinitionArn <<< "$task_def")" >> "$GITHUB_OUTPUT"

      - name: Run Release Tasks (Migrate, Static, Cache)
        env:
          TASK_DEF_ARN: ${{ steps.task-def.outputs.arn }}
        run: |
          NETWORK_CONFIG=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" | jq -c '.services[0].networkConfiguration')
          RELEASE_COMMAND="python manage.py migrate && python manage.py collectstatic --noinput && python manage.py clearsessions"

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides "{\"containerOverrides\": [{\"name\": \"${ECR_CONTAINER_NAME}\", \"command\": [\"bash\", \"-c\", \"$RELEASE_COMMAND\"]}]}" \
            | jq -r '.tasks[0].taskArn')

          echo "Waiting for Release Task ($TASK_ARN) to complete..."

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" | jq -r '.tasks[0].containers[0].exitCode')
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Release task failed! Halting deployment."
            exit 1
          fi

      - name: Deploy to Amazon ECS
        env:
          TASK_DEF_ARN: ${{ steps.task-def.outputs.arn }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF_ARN" > /dev/null

          deadline=$((SECONDS + 600))
          while true; do
            primary=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              | jq -c '.services[0].deployments[] | select(.status == "PRIMARY") | {taskDefinition, rolloutState}')
            td=$(jq -r .taskDefinition <<< "$primary")
            state=$(jq -r .rolloutState <<< "$primary")
            if [[ "$td" == "$TASK_DEF_ARN" && "$state" == "COMPLETED" ]]; then
              break
            fi
            if [[ "$state" == "FAILED" ]]; then
              echo "Deployment failed: $primary"
              exit 1
            fi
            if (( SECONDS > deadline )); then
              echo "Deployment did not complete within timeout: $primary"
              exit 1
            fi
            sleep 15
          done
