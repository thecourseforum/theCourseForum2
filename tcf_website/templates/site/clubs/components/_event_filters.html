<fieldset class="advanced-search club-event-filters" aria-label="Event filters" disabled>
    <div class="club-event-filters__row club-event-filters__row--search">
        <div class="advanced-search__field">
            <label for="event-search">Search events</label>
            <input type="search" id="event-search" placeholder="Event, club, keyword or location">
        </div>
        <div class="advanced-search__field">
            <label for="event-category">Category</label>
            <select id="event-category">
                <option>All categories</option>
            </select>
        </div>
        <div class="advanced-search__field">
            <label for="event-club">Club</label>
            <select id="event-club">
                <option>All clubs</option>
            </select>
        </div>
        <div class="advanced-search__field">
            <label for="event-sort">Sort by</label>
            <select id="event-sort">
                <option>Soonest first</option>
            </select>
        </div>
    </div>
    <div class="club-event-filters__row">
        <div class="advanced-search__field">
            <label for="event-from">From</label>
            <input type="date" id="event-from" value="{{ start_date|date:'Y-m-d' }}">
        </div>
        <div class="advanced-search__field">
            <label for="event-to">To</label>
            <input type="date" id="event-to" value="{{ end_date|date:'Y-m-d' }}">
        </div>
        <div class="advanced-search__field">
            <label for="event-interest">Interest</label>
            <select id="event-interest">
                <option>All interests</option>
            </select>
        </div>
        <label class="advanced-search__checkbox club-event-filters__canceled">
            <input type="checkbox">
            Show canceled events
        </label>
    </div>
    <div class="club-event-filters__actions">
        <button type="button" class="btn btn--md btn--secondary">Reset</button>
        <button type="button" class="btn btn--md btn--primary">Apply</button>
    </div>
</fieldset>
