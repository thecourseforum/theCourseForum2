name: tcf

services:
  db:
    # Postgres 18.1 to match prod RDS.
    image: postgres:18.1
    container_name: tcf_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGUSER: ${DB_USER}       # client tool defaults so psql/pg_* need no -U/-d
      PGDATABASE: ${DB_NAME}
    volumes:
      # postgres:18 images mount at /var/lib/postgresql, not /data,
      # so pg_upgrade can see multiple version directories.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 30

  valkey:
    # ElastiCache in prod runs Valkey 8.2; no such image on Docker Hub yet.
    image: valkey/valkey:8.1
    container_name: tcf_valkey
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: rustfs/rustfs:1.0.1
    container_name: tcf-minio
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"   # console UI
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Creates buckets and grants anonymous read on the static bucket
  # (stands in for CloudFront's signed origin access).
  minio-init:
    image: amazon/aws-cli:2.37.9
    container_name: tcf-minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        for bucket in ${MINIO_BUCKET:-tcf-media} ${STATIC_BUCKET:-tcf-static}; do
          aws s3api head-bucket --bucket "$$bucket" 2>/dev/null || aws s3api create-bucket --bucket "$$bucket" > /dev/null
        done
        aws s3api put-bucket-policy --bucket ${STATIC_BUCKET:-tcf-static} --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::${STATIC_BUCKET:-tcf-static}/*"]}]}'
        echo "buckets ready"
    restart: "no"

  # Serves the static bucket on :8081.
  cdn:
    build:
      context: .
      dockerfile: Dockerfile.cdn
    image: tcf-cdn:local
    container_name: tcf-cdn
    restart: unless-stopped
    environment:
      STATIC_BUCKET: ${STATIC_BUCKET:-tcf-static}
    ports:
      - "8081:80"
    depends_on:
      minio:
        condition: service_healthy

  # One-off job mirroring the ECS release task.
  release:
    profiles: ["full"]
    build:
      context: .
      target: prod
    container_name: tcf_release
    env_file: .env
    command: >
      bash -c "set -e &&
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      python manage.py invalidate_cachalot tcf_website &&
      python manage.py clearsessions"
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-tcf_core.settings.dev}
      TCF_ENV: ${TCF_ENV:-local}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    profiles: ["full"]
    build:
      context: .
      target: prod
    container_name: tcf_web
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-tcf_core.settings.dev}
      TCF_ENV: ${TCF_ENV:-local}
    ports:
      - "8000:80"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      release:
        condition: service_completed_successfully

  devcontainer:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    container_name: tcf_devcontainer
    command: sleep infinity
    environment:
      DJANGO_SETTINGS_MODULE: tcf_core.settings.dev
      TCF_ENV: local
    volumes:
      # Mount the checkout so the devcontainer contains the full source tree.
      - .:/app:cached
      # Docker-outside-of-docker: control sibling services via the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  rustfs_data:
