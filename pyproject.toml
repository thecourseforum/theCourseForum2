[project]
name = "thecourseforum"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "backoff>=2.2.1,<3",
    "boto3>=1.42.87,<2",
    "django-cachalot>=2.9.0,<3",
    "django-environ>=0.12,<0.15",
    "django-filter>=25.1,<26",
    "django-storages>=1.14.6,<2",
    "djangorestframework>=3.16,<3.18",
    "gunicorn>=23,<27",
    "numpy>=2.1,<3",
    "pandas>=2.3.3,<3",
    "psycopg[binary]>=3.3.3",
    "python-jose>=3.5.0,<4",
    "redis>=8.1,<9",
    "requests>=2.33.1,<3",
    "tqdm>=4.67.3,<5",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.3.3",
    "django-debug-toolbar>=4.4.6,<9",
    "django-stubs>=5.2,<6",
    "djangorestframework-stubs>=3.16,<4",
    "djlint>=1.46.4,<2",
    "prek>=0.5.2",
    "ruff>=0.9.0",
    "ty>=0.0.27",
    "types-requests>=2.31.0",
    "types-tqdm>=4.66.0",
    "websocket-client>=1.9.0,<2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W", "UP", "B", "SIM", "DJ"]
ignore = ["DJ001", "DJ008", "DJ012", "SIM102", "SIM108", "SIM114"]

[tool.ruff.lint.per-file-ignores]
"tcf_core/settings/*.py" = ["F403", "F405"]
"tcf_website/admin.py" = ["F403", "F405"]
"tcf_website/legacy_models.py" = ["F403", "F405"]
"tcf_website/models/__init__.py" = ["F401"]
"tcf_website/models/models.py" = ["F403", "F405"]
"tcf_website/tests/test_utils.py" = ["F403", "F405"]
"tcf_website/views/__init__.py" = ["F401"]

[tool.ty.rules]
# Django/ORM noise until ty + django-stubs catch up; re-enable as tooling improves.
unresolved-attribute = "ignore"
possibly-missing-submodule = "ignore"
no-matching-overload = "ignore"
invalid-argument-type = "ignore"
invalid-method-override = "ignore"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["tcf_core", "tcf_website", "manage.py"]
exclude = ["**/migrations", "tcf_website/legacy_models.py"]

[tool.djlint]
profile = "django"
indent = 4
max_line_length = 120
ignore = "H021"

[tool.django-stubs]
django_settings_module = "tcf_core.settings.dev"

[tool.coverage.run]
source = ["tcf_core", "tcf_website"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
